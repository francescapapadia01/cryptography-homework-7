<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistical independence – chi-square test</title>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--mut:#62626e;--card:#f3f3f7;--acc:#4f46e5;--bd:#d6d6de;--hi:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151b;--fg:#ececf2;--mut:#a0a0b0;--card:#202029;--acc:#8b85ff;--bd:#383846;--hi:#fb7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151b;--fg:#ececf2;--mut:#a0a0b0;--card:#202029;--acc:#8b85ff;--bd:#383846;--hi:#fb7185;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:820px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:18px 0 4px}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit;max-width:100%}
textarea{width:100%;min-height:80px;font:12.5px ui-monospace,Menlo,monospace}input[type=number]{width:80px}
.mut{color:var(--mut)}.key{color:var(--hi);font-weight:600}.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px}td,th{border:1px solid var(--bd);padding:4px 9px;text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body>
<h1>Statistical independence: contingency table and chi-square test</h1>
<div class="row"><label>Dataset <select id="ds"><option value="titanic">Titanic: sex × survival (891 passengers)</option><option value="sim">Simulated: operating system × phished (independent by construction)</option><option value="csv">My own data (paste below)</option></select></label>
<label>α <input id="al" type="number" step="0.01" min="0.001" max="0.2" value="0.05"></label><button class="btn" id="go">Analyze</button></div>
<textarea id="csv" placeholder="One observation per line: X,F&#10;e.g.&#10;Windows,Phished&#10;Linux,Not phished" style="display:none"></textarea>
<div id="out"></div>
<script>
/* ---------- chi-square test of independence ---------- */
function lgam(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=z,t=z+5.5;t-=(z+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return-t+Math.log(2.5066282746310005*s/z)}
function gammaQ(a,x){if(x<=0)return 1;const L=-x+a*Math.log(x)-lgam(a);
 if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<1000;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-16)break}return 1-sum*Math.exp(L)}
 let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<1000;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-15)break}return Math.exp(L)*h}
const chiP=(chi,df)=>gammaQ(df/2,chi/2);
function build(rows){const xs=[...new Set(rows.map(r=>r[0]))].sort(),fs=[...new Set(rows.map(r=>r[1]))].sort();
 const O=xs.map(()=>fs.map(()=>0));rows.forEach(([x,f])=>O[xs.indexOf(x)][fs.indexOf(f)]++);return{xs,fs,O}}
function analyse({xs,fs,O}){const r=xs.length,c=fs.length,R=O.map(a=>a.reduce((s,v)=>s+v,0)),C=fs.map((_,j)=>O.reduce((s,a)=>s+a[j],0)),n=R.reduce((a,b)=>a+b,0);
 const E=O.map((a,i)=>a.map((_,j)=>R[i]*C[j]/n));let chi=0,yates=0;
 const T=O.map((a,i)=>a.map((o,j)=>{const e=E[i][j],t=(o-e)**2/e;chi+=t;yates+=Math.max(0,Math.abs(o-e)-.5)**2/e;return t}));
 const df=(r-1)*(c-1);return{xs,fs,O,R,C,n,E,T,chi,yates,df,p:chiP(chi,df),pY:chiP(yates,df),V:Math.sqrt(chi/(n*Math.min(r-1,c-1))),minE:Math.min(...E.flat())}}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(u,p,v)=>{let s=0;for(let i=0;i<p.length;i++){s+=p[i];if(u<s)return v[i]}return v[v.length-1]};
function simIndep(n,seed){const u=rng(seed),rows=[];for(let i=0;i<n;i++)rows.push([pick(u(),[.5,.2,.3],['Windows','Linux','macOS']),pick(u(),[.85,.15],['Not phished','Phished'])]);return rows}
const DATA={
 titanic:()=>({xs:['female','male'],fs:['died','survived'],O:[[81,233],[468,109]]}),
 sim:()=>build(simIndep(600,2026))};

const $=id=>document.getElementById(id);
const pc=x=>(100*x).toFixed(1)+'%',fx=(x,d=2)=>x.toFixed(d);
function tbl(a,cells,head='',margin=true,rowTot=null,colTot=null,tot=null){let h=`<div class="scroll"><table><tr><th>${head}</th>${a.fs.map(f=>`<th>${f}</th>`).join('')}${rowTot?'<th>'+rowTot.h+'</th>':''}</tr>`;
 a.xs.forEach((x,i)=>{h+=`<tr><td>${x}</td>${cells[i].map(v=>`<td>${v}</td>`).join('')}${rowTot?`<td>${rowTot.v[i]}</td>`:''}</tr>`});
 if(colTot)h+=`<tr><td><b>${colTot.h}</b></td>${colTot.v.map(v=>`<td>${v}</td>`).join('')}${tot!==null?`<td>${tot}</td>`:''}</tr>`;return h+'</table></div>'}
function show(){const k=$('ds').value,al=+$('al').value||.05;let d;
 if(k==='csv'){const rows=$('csv').value.split(/\n/).map(l=>l.split(',').map(s=>s.trim())).filter(r=>r.length>=2&&r[0]&&r[1]);if(rows.length<2){$('out').innerHTML='<p>Paste at least two lines "X,F".</p>';return}d=build(rows)}else d=DATA[k]();
 if(d.xs.length<2||d.fs.length<2){$('out').innerHTML='<p>Need at least 2 categories for each variable.</p>';return}
 const a=analyse(d),r=a.xs.length,c=a.fs.length;let h='';
 h+=`<h2>1. Contingency table (observed counts) and marginals</h2>`+tbl(a,a.O,'X \\ F',true,{h:'total',v:a.R},{h:'total',v:a.C},a.n);
 h+=`<p class="mut">Marginal frequencies: X: ${a.xs.map((x,i)=>`${x} ${pc(a.R[i]/a.n)}`).join(', ')}; F: ${a.fs.map((f,j)=>`${f} ${pc(a.C[j]/a.n)}`).join(', ')}.</p>`;
 h+=`<h2>2. Conditional frequencies</h2><b>P(F | X)</b> (each row sums to 100%)`+tbl(a,a.O.map((row,i)=>row.map(o=>pc(o/a.R[i]))),'X \\ F')+`<b>P(X | F)</b> (each column sums to 100%)`+tbl(a,a.O.map(row=>row.map((o,j)=>pc(o/a.C[j]))),'X \\ F');
 h+=`<h2>3. Expected counts under independence, E = (row total × column total) / n</h2>`+tbl(a,a.E.map(row=>row.map(e=>fx(e))),'X \\ F');
 h+=`<h2>4. Contributions (O − E)² / E</h2>`+tbl(a,a.T.map(row=>row.map(t=>fx(t,3))),'X \\ F');
 const rej=a.p<al,strength=a.V<.1?'negligible':a.V<.3?'weak':a.V<.5?'moderate':'strong';
 h+=`<div class="card"><b>χ² = <span class="key">${fx(a.chi,3)}</span></b>, df = (${r}−1)(${c}−1) = ${a.df}, <b>p-value = <span class="key">${a.p<1e-4?a.p.toExponential(2):a.p.toFixed(4)}</span></b>, Cramér's V = ${fx(a.V,3)}${r===2&&c===2?`<br>With Yates' continuity correction: χ² = ${fx(a.yates,3)}, p = ${a.pY<1e-4?a.pY.toExponential(2):a.pY.toFixed(4)}`:''}<br>Smallest expected count: ${fx(a.minE)} ${a.minE>=5?'(≥ 5: chi-square approximation is reasonable)':'(< 5: the approximation may be unreliable)'}</div>`;
 h+=`<div class="card"><b>Interpretation (α = ${al}).</b> ${rej?`p < α: reject H₀ (X and F independent). The data are <b>not compatible with independence</b>: X and F are statistically dependent. The association is ${strength} (V = ${fx(a.V,2)}).`:`p ≥ α: <b>do not reject H₀</b>. The data are compatible with independence; there is no evidence of an association (this does not prove independence).`} Statistical association is not causation: a small p-value says the variables vary together, not that X causes F (confounders, selection and reverse causality are possible).</div>`;
 $('out').innerHTML=h}
$('go').onclick=show;$('ds').onchange=()=>{$('csv').style.display=$('ds').value==='csv'?'block':'none'};show();
</script></body></html>
